
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <!-- External Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-3">

        <h1>Student Grade Calculator</h1>

        <div class="row mt-4">
            <div class="col-md-8">

                <div class="input-group mb-3">
                    <span class="input-group-text">Student Name</span>
                    <input type="text" id="studentName" class="form-control">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Mark</span>
                    <input type="number" id="mark" class="form-control">
                </div>

                <div id="result" class="result">
                    Result will appear here.
                </div>

                <button class="btn btn-primary mt-3" onclick="calculateGrade()">
                    Calculate Grade
                </button>

            </div>
        </div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
